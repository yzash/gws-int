# Copy of the settings the setup wizard (python setup.py) writes to config.yaml.
# You normally do not need to edit this by hand.

project_id: gemini-usage-pov          # Google Cloud project ID (for reference only)
auth_mode: oauth                      # "oauth" (recommended) or "service_account"
credentials_file: credentials.json    # OAuth desktop client JSON (oauth mode)
token_file: token.json                # created automatically after first sign-in
service_account_file: service-account.json   # service_account mode only
impersonate_user: ""                  # service_account mode only: admin email to act as
customer_id: my_customer              # "my_customer" = the tenant of the signed-in admin

window_days: 28                       # reporting window, counted back from now
include_suspended: false              # include suspended users in summaries
timezone: UTC                         # used for "active days" (e.g. Asia/Singapore)

# Only events with these names count as Gemini usage in the summaries.
# Every event is still written to raw_events.csv. The run log lists any other
# event names it sees, so you can add them here if needed.
usage_event_names:
  - feature_utilization

# Optional (F10): only include users whose OU path starts with one of these.
# Example: ["/Sales", "/Engineering/APAC"]. Empty = whole tenant.
ou_filter: []

# Optional: override which audit-log parameter names feed each column, if your
# tenant's data uses different names. Example:
#   param_map:
#     feature: [feature_source, action]
param_map: {}

# ---------------------------------------------------------------- data sources
# Which optional sources to collect. Change with `python setup.py --modules`.
modules:
  activity_logs: true    # Drive, Meet, Chat, Calendar, Classroom, Keep, sign-ins, OAuth apps, Chrome (same permission as Gemini)
  usage_reports: false   # Google usage reports: active users per app, emails, Drive volumes, last sign-in (+1 read-only scope)
  licensing: false       # licence assignments (+ apps.licensing scope, which Google only offers as read+write)
  chrome: false          # installed Chrome extensions + ChromeOS telemetry (+2 read-only scopes)

# Audit logs fetched when activity_logs is on. Remove any you don't need.
activity_applications: [drive, meet, chat, calendar, login, token, classroom, keep, workspace_studio, chrome]
activity_window_days: null   # defaults to window_days; lower it if the Drive log is very large
gmail_sent_log: false        # per-message sent-mail log (large). Usage reports already give email counts.

# Licence products to list (Google product IDs). Missing products are skipped.
licence_products: [Google-Apps, "101047", "101031", "101034", "101037", "101038", "101039"]
ai_licence_keywords: [gemini, ai pro, ai ultra, ai expanded, ai meetings, ai security]
# App / extension names that count as "AI tools" (matched case-insensitively).
ai_app_keywords: [chatgpt, openai, claude, anthropic, copilot, perplexity, gemini, notebooklm, grammarly, otter, fireflies, deepseek, mistral, quillbot, magicschool, brisk, diffit, curipod]

# ---------------------------------------------------------------- analysis settings
work_hours: {start: 8, end: 18, days: [0, 1, 2, 3, 4]}   # 0 = Monday; used for after-hours metrics
office_ip_ranges: []          # e.g. ["203.0.113.0/24"] to measure office/school network vs home
periods: []                   # e.g. [{name: Term 3, start: 2026-07-01, end: 2026-09-10}, {name: Holiday, start: 2026-09-11, end: 2026-09-20}]
group_by: [ou_path, ou_level_1]   # also ou_level_2, or custom:<Schema>.<field> (listed in custom_fields)
custom_fields: []             # directory custom fields, e.g. ["Education.subject", "Education.grade"]
min_group_size: 10            # groups smaller than this are hidden in group tables
target_adoption_pct: 50       # groups below this Gemini reach are flagged
use_case_map: {}              # assign unclassified Gemini action/feature values, e.g. {generate_starter_freeform: Data and admin work}
pseudonymise: false           # same as `python run.py --pseudonymise`

# Scopes. Written by setup.py from `modules`; the tool refuses any scope not on its fixed list.
scopes:
  - https://www.googleapis.com/auth/admin.reports.audit.readonly
  - https://www.googleapis.com/auth/admin.directory.user.readonly
